version: 2.1

parameters:
  scheduled:
    type: boolean
    default: false

  run_search:
    type: boolean
    default: false

commands:
  install-dependencies:
    steps:
      - run:
          name: Install dependencies
          command: |
            pip install pandas numpy scipy statsmodels scikit-learn python-dotenv alpaca-py

jobs:
  parameter-search:
    docker:
      - image: cimg/python:3.12

    working_directory: ~/project

    steps:
      - checkout

      - install-dependencies

      - run:
          name: Run hyperparameter search
          command: |
            cd mlp_hyperparameter_search
            python -u mlpHyperparameterSearch.py

      - save_cache:
          name: Save best parameters
          key: mlp-hourly-results-v1-{{ epoch }}
          paths:
            - mlp_hyperparameter_search/mlp_csv_results

  hourly-paper-trading:
    docker:
      - image: cimg/python:3.12

    working_directory: ~/project

    steps:
      - checkout

      - install-dependencies

      - restore_cache:
          name: Restore best parameters
          keys:
            - mlp-hourly-results-v1-

      - run:
          name: Run hourly prediction and paper trading
          command: |
            cd mlp_hyperparameter_search
            python -u hourlyTrade.py

workflows:
  daily-parameter-search:
    when:
      and:
        - << pipeline.parameters.scheduled >>
        - << pipeline.parameters.run_search >>

    jobs:
      - parameter-search

  hourly-paper-trading:
    when:
      and:
        - << pipeline.parameters.scheduled >>
        - not: << pipeline.parameters.run_search >>

    jobs:
      - hourly-paper-trading
