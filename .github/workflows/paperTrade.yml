name: Paper Trading
on:
  schedule:
    - cron: "35 14 * * 1-5" 
    # run at 14:35 UTC (10:35 AM EST) every weekday (Monday to Friday)
    #for Phenix, AZ, which is UTC-7, this will run at 7:35 AM local time every weekday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mlp_hyperparameter_search

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas numpy scipy statsmodels scikit-learn python-dotenv alpaca-py
      - name: Run hyperparameter search
        run: python mlpHyperparameterSearch.py
        
      - name: Run paper trading
        run: python scheduledTrade.py
