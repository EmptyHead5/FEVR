name: Paper Trading

on:
  schedule:
    - cron: "35 9-15 * * 1-5"
      timezone: "America/New_York"
      # Run hourly from 9:35 AM through 3:35 PM ET.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mlp_hyperparameter_search

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas numpy scipy statsmodels scikit-learn python-dotenv alpaca-py

      - name: Run hyperparameter search
        run: python -u mlpHyperparameterSearch.py

      - name: Run paper trading
        run: python -u scheduledTrade.py
