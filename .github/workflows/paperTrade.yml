#study from https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Paper Trading
on:
  schedule:
    - cron: "5 16 * * 1-5"  
    # Run at 16:05 UTC every weekday (Monday to Friday).
    # For Phoenix, AZ (UTC-7), this runs at 9:05 AM local time.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mlp_hyperparameter_search

    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas numpy scipy statsmodels scikit-learn python-dotenv alpaca-py
      - name: Run hyperparameter search
        run: python -u mlpHyperparameterSearch.py
        
      - name: Run paper trading
        run: python -u scheduledTrade.py
